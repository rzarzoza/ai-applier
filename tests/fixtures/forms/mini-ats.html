<!doctype html>
<html>
<head><title>Mini ATS - Software Engineer Intern</title></head>
<body>
<section id="description">
  <h1>Software Engineer Intern</h1>
  <p>Build developer tools at Mini Co with a small, friendly team.</p>
</section>

<form id="app" onsubmit="return false">
  <label for="first">First Name</label>
  <input id="first" name="first" type="text" required>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>

  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel" required>

  <label for="reloc">Are you willing to relocate?</label>
  <select id="reloc" name="reloc" required>
    <option value="">Select...</option>
    <option value="y">Yes</option>
    <option value="n">No</option>
  </select>

  <label for="project">Tell us about a project you are proud of</label>
  <textarea id="project" name="project"></textarea>

  <label><input type="checkbox" name="certify" required> I certify that the information above is accurate</label>
  <label><input type="checkbox" name="sms"> Text me about new roles</label>

  <button type="button" id="submit">Submit application</button>
</form>

<div id="challenge" hidden>
  <iframe title="captcha challenge" srcdoc="<p>Select every bus</p>"></iframe>
  <button type="button" id="solve">Solve</button>
</div>
<div id="oops" hidden>Something went wrong on our side</div>
<div id="thanks" hidden><h2>Thank you for applying</h2></div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var form = document.getElementById("app");
  var phone = document.getElementById("phone");

  // ?sabotage=1: the first-name box refuses to keep a value.
  if (params.has("sabotage")) {
    document.getElementById("first").addEventListener("input", function (e) { e.target.value = ""; });
  }

  // ?conditional=1: answering "Yes" to relocation reveals a required follow-up question.
  if (params.has("conditional")) {
    document.getElementById("reloc").addEventListener("change", function (e) {
      if (e.target.value !== "y" || document.getElementById("cities")) return;
      var submit = document.getElementById("submit");
      var label = document.createElement("label");
      label.htmlFor = "cities";
      label.textContent = "Which cities would you consider?";
      var input = document.createElement("input");
      input.id = "cities";
      input.name = "cities";
      input.type = "text";
      input.required = true;
      form.insertBefore(label, submit);
      form.insertBefore(input, submit);
    });
  }

  // ?degree=1: after First Name, a required react-select-like "Degree" combobox. Its options are
  // "Associate's Degree", "Bachelor's Degree", "Master's Degree" (no "B.S."): opening it with an empty box shows them
  // all, typing filters them (contains, any case), and clicking one picks it. Typed text that was not picked is cleared
  // when the box loses focus or on Escape, like react-select. &lazy=1: nothing shows until something is typed.
  if (params.has("degree")) {
    var lazy = params.has("lazy");
    var degrees = ["Associate's Degree", "Bachelor's Degree", "Master's Degree"];
    var chosen = "";
    var dLabel = document.createElement("label");
    dLabel.htmlFor = "degree";
    dLabel.textContent = "Degree";
    var dInput = document.createElement("input");
    dInput.id = "degree";
    dInput.name = "degree";
    dInput.type = "text";
    dInput.required = true;
    dInput.autocomplete = "off";
    dInput.setAttribute("role", "combobox");
    dInput.setAttribute("aria-controls", "degree-list");
    var dList = document.createElement("div");
    dList.id = "degree-list";
    dList.setAttribute("role", "listbox");
    dList.hidden = true;
    // Keeps focus in the box while an option is clicked (react-select does the same).
    dList.addEventListener("mousedown", function (e) { e.preventDefault(); });
    var emailLabel = document.querySelector('label[for="email"]');
    form.insertBefore(dLabel, emailLabel);
    form.insertBefore(dInput, emailLabel);
    form.insertBefore(dList, emailLabel);
    var render = function () {
      var q = dInput.value.toLowerCase();
      dList.innerHTML = "";
      if (lazy && !q) { dList.hidden = true; return; }
      degrees.filter(function (d) { return d.toLowerCase().indexOf(q) >= 0; }).forEach(function (d) {
        var o = document.createElement("div");
        o.setAttribute("role", "option");
        o.textContent = d;
        o.addEventListener("click", function () { chosen = d; dInput.value = d; dList.hidden = true; });
        dList.appendChild(o);
      });
      dList.hidden = !dList.children.length;
    };
    var close = function () { dInput.value = chosen; dList.hidden = true; };
    dInput.addEventListener("click", render);
    dInput.addEventListener("input", render);
    dInput.addEventListener("blur", close);
    dInput.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
  }

  // ?file=<label>: adds a required file upload with that label (e.g. "Resume/CV" or "Transcript").
  if (params.has("file")) {
    var submitBtn = document.getElementById("submit");
    var fileLabel = document.createElement("label");
    fileLabel.htmlFor = "upload";
    fileLabel.textContent = params.get("file");
    var fileInput = document.createElement("input");
    fileInput.id = "upload";
    fileInput.name = "upload";
    fileInput.type = "file";
    fileInput.required = true;
    form.insertBefore(fileLabel, submitBtn);
    form.insertBefore(fileInput, submitBtn);

    // &parse=1: like Lever, choosing a file shows "Analyzing resume…", and ~500ms later the "parser" clears the
    // first name and overwrites the email with what it read from the resume, then hides the indicator. Submit does
    // nothing while it is analyzing.
    if (params.has("parse")) {
      var analyzing = document.createElement("div");
      analyzing.id = "analyzing";
      analyzing.textContent = "Analyzing resume…";
      analyzing.hidden = true;
      form.insertBefore(analyzing, submitBtn);
      fileInput.addEventListener("change", function () {
        analyzing.hidden = false;
        setTimeout(function () {
          document.getElementById("first").value = "";
          document.getElementById("email").value = "parsed@resume.example";
          analyzing.hidden = true;
        }, 500);
      });
    }
  }

  function send() {
    var data = {};
    new FormData(form).forEach(function (v, k) { data[k] = String(v); });
    fetch("/submit", { method: "POST", body: JSON.stringify(data) }).then(function () {
      form.hidden = true;
      document.getElementById("thanks").hidden = false;
    });
  }

  document.getElementById("submit").addEventListener("click", function () {
    document.querySelectorAll(".error").forEach(function (e) { e.remove(); });
    if (params.has("silent")) return;
    var busy = document.getElementById("analyzing");
    if (busy && !busy.hidden) return;
    if (params.has("oops")) { document.getElementById("oops").hidden = false; return; }
    if (!/^\d+$/.test(phone.value)) {
      var s = document.createElement("span");
      s.className = "error";
      s.textContent = "Invalid phone";
      phone.after(s);
      return;
    }
    if (params.has("captcha")) { document.getElementById("challenge").hidden = false; return; }
    send();
  });

  document.getElementById("solve").addEventListener("click", function () {
    document.getElementById("challenge").hidden = true;
    send();
  });
})();
</script>
</body>
</html>
